  4.5:                       # Ban by identity key (1 criterion)
    note: >-
      Proves the ban surface end to end over the real CLI host, real spawned
      server children, and the durable store. The operator surface is the
      Story 4.2 CLI host (no new entrypoint): `agent-room ban <fingerprint>
      [--reason]` / `unban` answer JSON lines with stable exit codes and one
      coded stderr line on malformed usage. Enforcement: the authz stage
      refuses every session-authenticated request from a banned key with the
      coded `banned` (403) — send and read land at NEXT request while a
      non-banned peer is untouched and history is kept; the gate is a direct
      indexed store query per request (deliberately not a cached set, so a
      ban the separate CLI process commits is visible at next request
      through WAL) and the stage stays a structural pass-through without a
      ban surface. The long-poll read loop re-checks each poll iteration, so
      an in-flight hold terminates within its window with the coded refusal
      — never a killed connection past the 20 s bound. Re-enroll from a
      banned key is refused `banned` after the possession proof and before
      any invite use is consumed. Persistence (the Epic 2 review's B1
      boundary, closed here): ban state survives close-and-reopen at the
      store layer and a full server restart driven by a real CLI child
      write, SIGKILL, and respawn; the registry keeps the first ban's
      timestamp and reason on re-ban, and unban deletes the row so traffic
      flows immediately. Review-hardened (2026-09-30 triage, 13 distinct
      patches applied, all proven): the store refusals are pinned by their
      error CODE (`invalid_actor_id` / `invalid_request`), `banned_at` is
      pinned to the canonical ISO 8601 shape at the store, restart, and
      CLI-receipt rows (plus one tautology fixed), the `banned_actors` CHECK
      constraint is proven against raw non-canonical INSERTs through a
      `DatabaseSync` handle (uppercase hex, uppercase prefix, short tail each
      a CHECK violation; the canonical shape inserting), `PRAGMA user_version`
      is pinned unchanged across the additive convergence and the
      divergent-shape refusal, the stage test gained the unbanned-fingerprint
      arm and the `store: {}` typeof-guard pass-through, the challenge route
      is pinned privilegeless-open to a banned key, the CLI family's refusal
      leg (valid argv into a coded `data_directory_invalid` store failure:
      exit 1, empty stdout, exactly one coded JSON stderr line) has its own
      row, the usage-refusal row pins that no store file was ever opened, the
      refused reattach pins `uses_remaining` unchanged, the unban receipts pin
      exactly one stdout line each, and `createInviteOperations` now REQUIRES
      the `isBanned` reader (a construction without it is a coded
      `invalid_argument`, never a silent enrollment-gate loss). Honest
      boundary: per the frozen Story 4.4 stage order, a banned key that has
      exhausted its OWN request budget or send bucket is answered 429
      `rate_limited` before the authz stage can answer 403 `banned` — the
      refusal stays pre-handler in every case and no banned request reaches a
      handler, but the refusal CODE alternates with the key's own budget
      state; the ban tests deliberately widen the rate gates, so they do not
      exercise that alternation. Does NOT prove: bans scoped beyond one
      realm/server (the registry is the store's — multi-process deployment is
      out of scope per AD-2), any rate-based or heuristic banning (the
      operator names the key), the CLI host's own surface (Story 4.2's
      evidence), or the 4.5 interactions with storage refusal (Story 4.6's
      refusal path). Suite state at close, finalizer run 2026-09-30:
      `node --test --test-timeout=300000` → 497 pass / 0 fail / 0 skipped;
      the epic-4 sweep verdicts `gaps` on exactly 4.7/4.8 (the future
      stories) with 4.5 evidenced.

    evidence:
      - test: "a ban lands at next request: send and read are refused banned, a non-banned peer is untouched, history is kept"
        file: "tests/ban.test.mjs"
      - test: "the authz stage refuses a banned session key and stays a structural pass-through without a ban surface"
        file: "tests/ban.test.mjs"
      - test: "an active long-poll terminates within its window when the key is banned mid-hold"
        file: "tests/ban.test.mjs"
      - test: "re-enroll from a banned key is refused banned after proof and before any use is consumed"
        file: "tests/ban.test.mjs"
      - test: "unban restores sends and reads immediately"
        file: "tests/ban.test.mjs"
      - test: "ban state survives a full server restart: CLI child writes, SIGKILL, respawn, refusal"
        file: "tests/ban.test.mjs"
      - test: "the ban registry persists bans by fingerprint, keeps the first ban on re-ban, and answers the gate read"
        file: "tests/ban.test.mjs"
      - test: "ban state survives close and reopen — the store restart (B1)"
        file: "tests/ban.test.mjs"
      - test: "the ban family answers JSON lines with stable exit codes on the Story 4.2 host"
        file: "tests/ban.test.mjs"
      - test: "the ban registry refuses malformed identities and reasons with coded store errors"
        file: "tests/ban.test.mjs"
      - test: "the banned_actors CHECK constraint refuses non-canonical keys at the storage layer"
