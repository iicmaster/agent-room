      transport error), abort threading (mid-wait and at-wait-completion), and
      the mutation suite kills all 14 attempted regressions. Does NOT prove
      reconnection during an in-flight long-poll hold (Story 2.5's drill), the
      v0.1→v0.2 migration's cursor reset (Story 2.3), or soak endurance
