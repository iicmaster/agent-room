      metadata block plus the exact withheld artifact between delimiters,
      byte-matched for the cached copy, and for an evicted record recovered
      by point read (`after_seq = seq − 1`, `limit = 1`) through the REAL
      server with the untrusted envelope re-applied by the CLI's seam
      (105 foreign sends past the cache cap; the recovery result is provably
      not re-cached and the provenance line names the serving path); unknown
      and malformed ids exit non-zero naming the id and the expected form,
      and a released record is never shown again. AC-2 (allow / --remove):
      the name resolves on the current realm from this realm's held records
      and from a live foreign installation's presence row, realm +
      fingerprint are reported, the entry is persisted at 0600 (original
      added_at preserved on re-allow), and release goes through the
      pipeline's own heldClear per (room, seq) matched by actor_fingerprint —
