  3.4:                       # The human CLI surface (HCI-2) (4 criteria)
    note: >-
      Proves the terminal trust surface over the finished pipeline. AC-1
      (held list / held show): `agent-room held list` names the realm, prints
      one metadata line per record (id `<room_id>:<seq>`, chat id,
