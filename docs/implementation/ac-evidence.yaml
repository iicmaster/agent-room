  4.6:                       # Storage admission control (2 criteria)
    note: >-
      Proves both clauses against the real surfaces, with the free-space
      source injectable at every layer so a full disk is simulated without
      filling one, and the real mechanism (one statfs of the data directory:
      bavail × bsize) proven against the live filesystem in its own row.
      AC-1 (the gates and the reserves): the append path's gate lives INSIDE
      the store's BEGIN IMMEDIATE transaction, ordered after the idempotency
      lookup and the duplicate gate and immediately before the insert — so a
      NEW append below the refuse reserve throws the coded storage_low and
      the transaction rolls back having written nothing, while an exact
      retry, a duplicate drop, and every read keep resolving from reads
      alone (reserves are capacity gates, never retention quotas: no code
      path in the repository deletes a committed message); between the
      reserves appends COMMIT and the warn line goes out at most once per
      STORAGE_WARN_INTERVAL_MS on the append's own injectable clock (proven
      through the real server against an injected sink AND through the
      default process-stderr sink on the wall clock); the thresholds are
      tunable via startServer overrides (validated at startup: junk and
      refuse-above-warn fail invalid_argument) and the two
      AGENT_ROOM_STORAGE_* env knobs for the direct launch and the capacity
      command (junk warns once and falls back to the declared default); and
      `agent-room capacity` — a command of the CLI HOST 4.2 established, no
      store open, the gate's own statfs mechanism — answers one JSON line
      (free bytes, FR-22's database/WAL byte counts, both reserves, state
      ok/warn/refuse, admits_appends) with exit 0 while appends are admitted,
      1 below the refuse reserve or when the data directory cannot be
      inspected, 2 on usage. AC-2 (the refused or disk-full send): over the
      wire the refusal is EXPLICIT and never an acknowledgment — 200
      {ok:true, result:{status:'storage_low'}}, the FR-17 status, not an
      error envelope; the message is absent from the page, absent from a
      direct read-only inspection, and absent after a full server stop and
      store reopen (zero acknowledgment, durably), and the gap-free next
      append proves the refusal consumed no sequence (the refused send's own
      client_message_id then commits under its original identity once space
      returns); reads, presence, and enumeration answer 200 throughout the
      refusal. The raced disk-full mapping — SQLITE_FULL at the INSERT face
      mapping to the same coded storage_low after the rollback (the commit
      face maps through the same shared catch but no drivable seam exercises
      it) — was the 4-6 review's strongest deferred finding (carried in
      spec-4-6's Deferred Review Findings as internal-2-1) and is now PROVEN
      (4-6 re-run, 2026-09-30): the store's open-time maxPageCount seam caps
      the connection's own database pages, so the NEXT page allocation at the
      INSERT answers a real errcode 13 through the real appendMessage while
      the injected free-space source stays above every reserve — two rows
      prove it (store-level: the mapped coded refusal names the disk, the
      warn sink stayed silent because the gate never fired, the rollback
      wrote nothing, and a fresh connection takes the gap-free next seq;
      wire-level: the IN-PROCESS send route (startServer) answers 200
      {ok:true,result:{status:'storage_low'}}, never a raw SQLite error, and
      the refused message is absent after a full stop and reopen — the
      SPAWNED face is separately proven by the env-tuned child row below).
      Operator tuning THROUGH a spawned child's env is likewise now proven
      end-to-end (internal-2-2): a real direct-launch child with a raised
      refuse reserve refuses sends over the wire, a junk value produces
      exactly one `agent-room-server: ignoring invalid …` stderr line with
      the declared defaults in effect, and the contradictory resolved pair
      (WARN=0 beside the default refuse) fails both operator faces coded —
      the capacity CLI exit 1 and the direct launch's early exit with the
      coded stderr line; the MCP face rides the same env proof (message_send
      surfaces the 200 result's storage_low status as a TOOL result, never an
      error, never outcome_unknown), and a plugin-managed auto-start child
      inherits the two knobs through ensure-server's pinned closed
      whitelist. Still NOT proven: backup and restore EXECUTION (the guide
      is pinned for content and section structure; running it against a live
      disk is the operator's walkthrough), or Story 4.7's TLS deployment
      guide (its own story). The re-run also added: capacity's negative rows
      (the command answers one JSON line exit 0 with the store file corrupt —
      it opens NO store — and refuses a non-ENOENT statfs failure coded
      data_directory_invalid exit 1); the duplicate-gate index's column-set
      verification with a squatter-fixture refusal (a same-name index over
      different columns is a coded database_schema_invalid at open, closing
      internal-1-6/2-7/4-4) plus the upgrade-time full-disk open row (a
      capped open needing index pages fails with raw errcode 13 and the next
      clean open converges, nothing lost); the warn sink deferred to after
      COMMIT — its captured line dropped when the transaction rolls back and
      a throwing sink never recoloring committed work (internal-1-4); the
      storage gate's clock injected at the SERVER layer (storageNowMs driving
      the warn-interval boundary through real sends — luna-F3); and the
      auto-start child's env whitelist now an exported pure helper pinned to
      its exact key set (PATH, LANG, AGENT_ROOM_DATA_DIR, knobs only when
      set) with a canary proving nothing else passes.
    evidence:
