      - test: "eviction past 100 entries: cached body copies drop oldest-first, every held record survives, and eviction never deletes, approves, or skips"
        file: "tests/held.test.mjs"
      - test: "recovery by point read: an evicted body is fetched with exactly after_seq = seq − 1 and limit = 1, a cached body never triggers a read, and a released record is never recoverable"
        file: "tests/held.test.mjs"
      - test: "recovery through the real api-client against a real server: 105 foreign messages register held, the cache keeps at most 100 copies, and an evicted body point-reads back byte-for-byte as the artifact the pipeline withheld"
        file: "tests/held.test.mjs"
      - test: "the held cache and the read cursor are separate files: registration never touches the cursor, and a cursor advance never loses held state"
        file: "tests/held.test.mjs"
      - test: "cursor independence over the real surface: a held seq is consumed by the cursor, a cursorless re-read never re-delivers, the held list still shows the records, and real local deliveries register nothing"
        file: "tests/held.test.mjs"
      - test: "the held tools over the real surface: room_held_list carries exactly the metadata whitelist (zero body bytes, even after eviction and recovery), room_held_count counts, and no agent-reachable path reaches a held body"
        file: "tests/held.test.mjs"
